<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>JavaScript</title>
    </head>

    <body>
        <h1>환영 메세지</h1>

        <div>
            <input type="text" placeholder="이름을 입력하세요" id="nameInput">
            <button type="button" id="confirmBtn">확인</button>
        </div>
    
        <script>
            // JAVASCRIPT 코드 작성
            // alert("JavaScript 작동");

            // >>> 목적 : 이름 입력 & 확인 버튼 누르면 환영합니다 메세지 뜨게 하기! <<<
            
            // 변수 : 값을 저장하는 공간

            // 버튼 요소를 가져오기
            const confirmBtn = document.querySelector("#confirmBtn");
            // 버튼에 '클릭 이벤트'를 등록
            confirmBtn.addEventListener("click", () => {
            // {} 안에 버튼 클릭하면 실행될 코드
            //alert("확인 버튼 클릭");


            // 입력 태그 요소 가져오기
            const nameInput = document.querySelector("#nameInput");
            // 입력 요소로 부터 입력값 가져오기
            const name = nameInput.value;


            // 가져온 입력 값이 비워진 상태인지 점검 (이름 입력했을때만 정상 작동)

            // IF NAME IS BLANK ""
            if(name == "") {
                // alert(""); ==> 경고창 열기
                alert("이름이 빈칸입니다. 입력해주세요.");
                return; // 중단
            }

            alert(name + "님 반갑습니다!");

            });

        </script>
    </body>

</html>
