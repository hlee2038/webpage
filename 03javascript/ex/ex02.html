<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>더하기 계산기</title>
    </head>


    <body>
        <h2>더하기 계산기</h2>
        <div>
            <input type="number" id="number1Input"> +
            <input type="number" id="number2Input">
            <button type="button" id="plusBtn">더하기</button>
        </div>

        <h3 id="resultH3">계산된 숫자 = <span id="resultSpan">( )</span>
        </h3>
    

        <script>
            // 더하기 버튼 활용하기
            const plusBtn = document.querySelector("#plusBtn");

            // 버튼 클릭에 이벤트 등록
            plusBtn.addEventListener("click", () => {
                const number1Input = document.querySelector("#number1Input");
                const number1 = Number(number1Input.value);
                // ... = Number() 괄호 안에 있는 데이터를 문자열에서 숫자 타입으로 바꿔줌
                const number2Input = document.querySelector("#number2Input");
                const number2 = Number(number2Input.value);
                // ... = Number() 괄호 안에 있는 데이터를 문자열에서 숫자 타입으로 바꿔줌

                // --- 데이터 타입 알아보기 ---
                // 문자열 : 문자들이 나열된 타입
                // 숫자

                if(number1 == "") {
                    alert("첫번째 숫자를 입력하세요");
                    return;
                }
                if(number2 == "") {
                    alert("두번째 숫자를 입력하세요");
                    return;
                }

                const result = number1 + number2;

                const resultSpan = document.querySelector("#resultSpan");
                resultSpan.textContent = result;

                const resultH3 = document.querySelector("#resultH3");
                // 태그 내용을 바꾼다
                //resultH3.textContent = "계산된 숫자 = " + result;

                //alert(result);
            
            });


        </script>
    </body>
</html>
