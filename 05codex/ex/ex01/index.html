<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>단위 변환기</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-switch" viewBox="0 0 24 24">
      <path d="M4 7h16m-4-4 4 4-4 4m4 6H4m4-4-4 4 4 4"/>
    </symbol>
    <symbol id="icon-ruler" viewBox="0 0 24 24">
      <path d="m2 17 15-15 5 5L7 22zM5 14l2 2m1-5 2 2m1-5 2 2m1-5 2 2"/>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path fill="currentColor" d="M21 14A9 9 0 0 1 10 3a9 9 0 1 0 11 11Z"/>
    </symbol>
    <symbol id="icon-scale" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 12a5 5 0 0 1 10 0Zm5 0 2-3"/>
    </symbol>
  </svg>
  <main class="dashboard">
    <nav class="site-nav" aria-label="주 메뉴">
      <a class="action" href="index.html" aria-current="page">홈</a>
      <a class="action" href="length.html">길이 변환</a>
      <a class="action" href="weight.html">무게 변환</a>
    </nav>
    <header class="hero">
      <div class="hero-mark"><svg class="icon" aria-hidden="true"><use href="#icon-switch"/></svg></div>
      <div class="hero-content">
        <h1>단위 변환기</h1>
        <p lang="en">Unit Converter</p>
      </div>
      <div class="ruler" aria-hidden="true"></div>
      <div class="theme" role="group" aria-label="화면 모드">
        <button type="button" id="light-theme" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#icon-sun"/></svg>라이트</button>
        <button type="button" id="dark-theme" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-moon"/></svg>다크</button>
      </div>
    </header>
    <div class="converter-menu">
      <a class="card input-card converter-link" href="length.html">
        <h2><svg class="icon" aria-hidden="true"><use href="#icon-ruler"/></svg>길이 단위 변환기</h2>
        <p>밀리미터, 미터, 인치, 마일 등 길이 단위를 변환합니다.</p>
      </a>
      <a class="card input-card converter-link" href="weight.html">
        <h2><svg class="icon" aria-hidden="true"><use href="#icon-scale"/></svg>무게 단위 변환기</h2>
        <p>그램, 킬로그램, 파운드, 톤 등 무게 단위를 변환합니다.</p>
      </a>
    </div>
  </main>
</body>
</html>
