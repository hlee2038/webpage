<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 추첨기</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/script.js" defer></script>
</head>
<body>
  <header class="masthead">
    <span class="game-icon" aria-hidden="true"></span>
    <span>로또 번호 추첨기</span>
  </header>
  <main class="stage">
    <div class="scenery" aria-hidden="true">
      <span class="cloud cloud-left"><i class="cat"></i></span>
      <span class="cloud cloud-right"></span>
      <span class="comet"><i class="star"></i></span>
      <span class="star sparkle one"></span><span class="star sparkle two"></span>
      <span class="star sparkle three"></span><span class="star sparkle four"></span>
      <span class="skyline"></span>
    </div>
    <div class="content">
      <span class="badge">LOTTO 6/45</span>
      <h1><span>로또</span> <span>번호</span> <span>추첨기</span></h1>
      <p class="intro">1~45 사이의 숫자 중 6개를 무작위로 추첨합니다.</p>
      <div class="tray">
        <ol class="balls" role="list" aria-label="추첨 번호">
          <li class="ball" aria-label="빈 공">–</li>
          <li class="ball" aria-label="빈 공">–</li>
          <li class="ball" aria-label="빈 공">–</li>
          <li class="ball" aria-label="빈 공">–</li>
          <li class="ball" aria-label="빈 공">–</li>
          <li class="ball" aria-label="빈 공">–</li>
        </ol>
      </div>
      <button class="draw" id="draw-button" type="button" autocomplete="off">
        <span class="game-icon" aria-hidden="true"></span>
        <span id="draw-label">번호 추첨하기</span>
      </button>
      <p class="sr-only" role="status" id="draw-status"></p>
    </div>
  </main>
</body>
</html>
