<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>예금 이자 계산기</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>


    <body>
    <!-- HEADER -->
        <h1 class="mt-4 text-center text-primary fw-bold">예금 이자 계산기</h1>
        <h6 class="text-center text-secondary fw-bold">예금 정보를 입력하고 이자를 계산해 보세요.</h6>
        <div class="container"><hr></div>

        <!-- BOX 예금 입력 정보 칸 -->
        <div class="container pb-3 bg-light rounded border">
            <h4 class="py-4 fw-bold">예금 정보 입력</h4>

            <label>예금 금액 (원)</label><br>
            <input type="number" class="form-control mt-2" id="wonInput"><br>

            <label">연 이율 (%)</label><br>
            <input type="number" class="form-control mt-2" id="percentInput"><br>

            <label>예치 기간 (년)</label><br>
            <input type="number" class="form-control mt-2" id="yearInput"><br>

            <button type="button" class="my-1 btn btn-primary" id="calculateBtn">이자 계산하기</button>
        </div>


        <!-- BOX 계산 결과 칸 -->
        <div class="container mt-3 pt-1 pb-3 rounded border">
            <p>
            <h4 class="fw-bold">계산 결과</h4><hr>
            </p>
            
            <!----------- 예상 이자 ----------->
            <p class=fw-bold id="resultW1">예상 이자</p>
            <p class="text-success fw-bold">
                <span id="resultSpan1" class="fw-bold text-success">-</span> 원
            </p>
            
            <!----------- 만기 시 총 금액 ----------->
            <p class=fw-bold id="resultW2">만기 시 총 금액</p>
            <p class="text-primary fw-bold">
                <span id="resultSpan2" class="fw-bold text-primary">-</span> 원
            </p>

        </div>


        <div class="container pt-2 text-secondary fw-bold">
            <p>※ 세금과 복리를 고려하지 않은 단리 계산입니다.</p>
        </div>


        <script>
            const calculateBtn = document.querySelector("#calculateBtn")
            calculateBtn.addEventListener("click", () => {

                const wonInput = document.querySelector("#wonInput")
                const won = Number(wonInput.value);
                if(won == "") {
                alert("예금 금액을 입력하세요");
                return;             
                }

                const percentInput = document.querySelector("#percentInput")
                const percent = percentInput.value;
                if(percent == "") {
                alert("연 이율을 입력하세요");
                return;
                }

                const yearInput = document.querySelector("#yearInput")
                const year = yearInput.value;
                if(year == "") {
                alert("예치 기간을 입력하세요");
                return;
                }

                // 예상 이자 결과
                const resultW1 = won * percent /100 * year;
                const resultSpan1 = document.querySelector("#resultSpan1");
                resultSpan1.textContent = Math.round(resultW1); 
                
                // 만기 시 총 금액 결과
                const resultW2 = won + resultW1;
                const resultSpan2 = document.querySelector("#resultSpan2")
                resultSpan2.textContent = Math.round(resultW2);

            });

        </script>
    </body>
</html>
