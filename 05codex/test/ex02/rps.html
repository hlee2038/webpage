<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가위바위보 | Rock Paper Scissors</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 0 105%, #dfefcb 0 8%, transparent 8.2%),
      radial-gradient(ellipse at 100% 105%, #dfefcb 0 8%, transparent 8.2%), #fbf3ee;
    color: #252e3f;
    font-family: ui-rounded, "Arial Rounded MT Bold", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    text-align: center;
  }
  main { width: min(93%, 1340px); margin: auto; padding: 12px 0 24px; }
  h1 {
    margin: 0;
    font-size: clamp(22px, 4.4vw, 65px);
    font-weight: 1000;
    letter-spacing: -.045em;
    line-height: 1.08;
  }
  h1 span { display: inline-block; }
  h1 .rock { color: #0878cc; transform: rotate(-6deg); }
  h1 .paper { color: #bd7900; }
  h1 .scissors { color: #df202b; transform: rotate(5deg); }
  header p {
    display: table;
    margin: 9px auto 18px;
    padding: 6px clamp(16px, 4vw, 58px) 9px;
    border-radius: 999px;
    background: linear-gradient(#59b85a, #398d3d);
    color: white;
    font-size: clamp(15px, 2.15vw, 31px);
    font-weight: 850;
  }
  .stats, .game { background: #fffdfd; box-shadow: 0 7px 18px #a9572524; }
  .stats {
    display: grid;
    grid-template-columns: 1.2fr repeat(6, 1fr);
    gap: 5px;
    margin: 0 0 18px;
    padding: clamp(10px, 1.4vw, 20px) clamp(6px, 1.6vw, 24px);
    border-radius: 32px;
  }
  .stat { min-width: 0; padding: 0 6px; }
  .stat:nth-child(1), .stat:nth-child(4), .stat:nth-child(5), .stat:nth-child(6) { border-right: 2px solid #e7e4e5; }
  dt { font-size: clamp(12px, 1.65vw, 24px); font-weight: 820; }
  dt span { color: var(--accent, #0079c9); font-weight: 950; }
  dd {
    margin: 5px auto 0;
    width: 100%;
    border-radius: 999px;
    font-size: clamp(20px, 3vw, 44px);
    line-height: 1.2;
    font-weight: 950;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .wins { --accent: #087728; }
  .losses { --accent: #c41d30; }
  .rate, .best { --accent: #a65600; }
  .streak { --accent: #167d37; }
  .wins dd { background: #cdf3cb; color: var(--accent); }
  .losses dd { background: #ffd6d8; color: var(--accent); }
  .draws dd { background: #c9e9ff; }
  .game { border-radius: clamp(25px, 4.7vw, 68px); padding: clamp(14px, 2.2vw, 32px) clamp(12px, 3.3vw, 48px) 16px; }
  .arena {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: clamp(5px, 1.1vw, 16px);
  }
  .side {
    --edge: #0088e4;
    --light: #d9efff;
    --dark: #b9e0fb;
    position: relative;
    isolation: isolate;
    padding-bottom: clamp(12px, 1.7vw, 25px);
  }
  .side::before {
    content: "";
    position: absolute;
    inset: clamp(14px, 2.2vw, 32px) 0 0;
    z-index: -1;
    border-radius: clamp(22px, 5.9vw, 85px);
    background: radial-gradient(ellipse at 50% 42%, var(--light), var(--dark));
  }
  .computer { --edge: #efa900; --light: #fff7df; --dark: #ffedbb; }
  h2 {
    position: relative;
    width: min(84%, 320px);
    margin: 0 auto;
    padding: .14em .18em .22em;
    border-radius: 999px;
    background: linear-gradient(#35aaff, #007fdc);
    color: white;
    font-size: clamp(12px, 2.85vw, 42px);
    font-weight: 900;
  }
  .computer h2 { background: linear-gradient(#ffcb25, #ffb600); color: #422900; }
  .display {
    position: relative;
    display: grid;
    place-items: center;
    height: clamp(88px, 15.7vw, 226px);
    margin: 4px auto 0;
  }
  .display > svg { width: 90%; height: 100%; overflow: visible; }
  .display::after {
    content: "";
    position: absolute;
    left: 13%;
    top: 33%;
    width: 8%;
    height: 5%;
    border-radius: 999px;
    background: var(--edge);
    transform: rotate(13deg);
    box-shadow: 10px -33px var(--edge), 9px 33px var(--edge);
    opacity: .85;
  }
  .computer .display::after { left: auto; right: 13%; transform: scaleX(-1) rotate(13deg); }
  .choice-name {
    position: relative;
    width: min(75%, 255px);
    margin: -3px auto 0;
    padding: .07em .25em .13em;
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: #fffdfc;
    box-shadow: 0 5px var(--edge);
    font-size: clamp(18px, 3.6vw, 52px);
    font-weight: 950;
  }
  .vs { color: #125a99; font-size: clamp(22px, 6.2vw, 89px); font-weight: 1000; }
  .result {
    position: relative;
    isolation: isolate;
    margin: clamp(12px, 1.3vw, 19px) auto;
    width: min(100%, 1130px);
    padding: 5px 8px 10px;
    border-radius: clamp(20px, 4vw, 60px);
    background: #fff0cf;
    color: #803b00;
  }
  .result.win { background: radial-gradient(ellipse, #e8fbdc, #d3efc1); color: #087728; }
  .result.loss { background: #ffdadd; color: #a7182b; }
  .result.draw { background: #d4edff; color: #135b93; }
  .result strong { display: block; font-size: clamp(24px, 4.15vw, 58px); line-height: 1.17; font-weight: 1000; }
  .result p { margin: 3px 0 0; color: #252e3f; font-size: clamp(13px, 2vw, 29px); font-weight: 800; }
  .prompt { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font-size: clamp(14px, 1.8vw, 25px); font-weight: 850; }
  .prompt::before, .prompt::after { content: ""; flex: 1; height: 2px; background: #e7e4e5; }
  .choices { display: flex; justify-content: center; gap: clamp(6px, 1.75vw, 25px); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #142e50; outline-offset: 4px; }
  .pick {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(4px, 1vw, 14px);
    width: min(31%, 205px);
    padding: 3px 4px 5px;
    border: 0;
    border-radius: 999px;
    background: var(--button);
    box-shadow: 0 5px var(--edge), 0 8px 10px #243c5921;
    color: #192536;
    font-size: clamp(14px, 1.65vw, 24px);
    font-weight: 900;
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .pick svg { width: clamp(23px, 3.4vw, 48px); height: clamp(23px, 3.4vw, 48px); }
  .pick[data-choice="scissors"] { --button: #b6e1ff; --edge: #008df3; }
  .pick[data-choice="rock"] { --button: #bbefa4; --edge: #3da932; }
  .pick[data-choice="paper"] { --button: #ffbec6; --edge: #ed5267; }
  .pick:hover:enabled { filter: brightness(1.07); transform: translateY(-2px); }
  .pick:active:enabled { transform: translateY(4px); box-shadow: 0 1px var(--edge); }
  .pick:disabled { opacity: .6; cursor: default; box-shadow: 0 2px var(--edge); }
  #reset {
    margin-top: 17px;
    border: 2px solid #f08a13;
    border-radius: 999px;
    padding: 3px clamp(12px, 2vw, 30px);
    background: #fff9f0;
    color: #943c00;
    font-size: clamp(13px, 1.3vw, 18px);
    font-weight: 850;
    transition: background .15s, transform .15s;
  }
  #reset:hover { background: #ffe6c4; }
  #reset:active { transform: scale(.96); }
  .celebration { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
  .celebration i {
    position: absolute;
    left: var(--x);
    top: 75%;
    width: 7px;
    height: 11px;
    border-radius: 2px;
    background: var(--color);
    opacity: 0;
    animation: confetti 750ms var(--delay) ease-out backwards;
  }
  .result.reveal { animation: reveal 320ms ease-out; }
  @keyframes reveal { from { transform: scale(.97); } to { transform: scale(1); } }
  @keyframes confetti {
    15% { opacity: 1; }
    to { transform: translate(var(--drift), -88px) rotate(220deg); opacity: 0; }
  }
  @media (max-width: 680px) {
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); border-radius: 22px; row-gap: 9px; }
    .stat:nth-child(n) { border: 0; padding: 0 2px; }
    .display::after { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="skin" x2=".75" y2="1">
      <stop stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffe6d1"/>
    </linearGradient>
    <symbol id="rock" viewBox="0 0 200 200">
      <g fill="url(#skin)" stroke="#391a12" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M143 52C139 21 111 19 98 39C77 26 61 39 54 53C36 47 15 66 12 92C6 132 37 173 83 181C125 189 166 168 180 132C197 91 178 53 143 52Z"/>
        <path fill="none" stroke="#f4a68f" stroke-width="5" d="M101 42l7 15M57 61l7 17M103 104c-8 8-13 18-14 28"/>
        <path fill="none" d="M32 90c3 24 24 32 36 14c5-7 6-15 2-24c6 37 32 32 40 14"/>
        <path d="M144 52c-26-3-51 5-51 25c0 17 18 26 40 19"/>
      </g>
    </symbol>
    <symbol id="scissors" viewBox="0 0 200 200">
      <g fill="url(#skin)" stroke="#391a12" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M58 96C53 80 47 59 51 37C57 11 83 11 91 33C97 48 98 67 99 83C105 62 116 39 130 30C148 18 167 34 161 54C157 69 147 85 139 99C159 107 169 126 163 146C154 175 127 187 94 186C59 186 31 173 22 149C12 126 27 100 58 96Z"/>
        <path fill="none" stroke="#f4a68f" stroke-width="5" d="M110 140c-13 5-19 15-20 24"/>
        <path fill="none" d="M45 135c10 21 32 22 42 4c7-13-4-24-16-30"/>
        <path d="M144 102c-19-7-44-4-52 13c-7 15 10 31 33 25"/>
      </g>
    </symbol>
    <symbol id="paper" viewBox="0 0 200 200">
      <g fill="url(#skin)" stroke="#391a12" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M55 169c-14-13-23-30-31-43C9 101 22 88 37 100l18 21L44 66c-5-23 16-31 23-9l12 39l-5-63c-2-22 21-24 25-2l8 62l8-63c3-22 26-18 24 3l-5 65l15-39c8-21 29-12 22 10l-13 47c-6 23-10 42-26 56c-20 18-58 15-77-3Z"/>
        <path fill="none" stroke="#f4a68f" stroke-width="5" d="M57 121c16 0 27 7 30 22m30-18c-12 4-18 13-20 27"/>
      </g>
    </symbol>
    <symbol id="unknown" viewBox="0 0 200 200">
      <path d="M66 68c0-41 75-46 75-4c0 28-39 27-39 53" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
      <circle cx="102" cy="149" r="9" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
<main>
  <header>
    <h1><span class="rock">ROCK</span> · <span class="paper">PAPER</span> · <span class="scissors">SCISSORS</span></h1>
    <p>컴퓨터와 가위바위보 한판 승부!</p>
  </header>
  <dl class="stats" aria-label="누적 전적">
    <div class="stat"><dt><span aria-hidden="true">🎮</span> 전체 대결</dt><dd id="total">0</dd></div>
    <div class="stat wins"><dt><span aria-hidden="true">♔</span> 승리</dt><dd id="wins">0</dd></div>
    <div class="stat losses"><dt><span aria-hidden="true">✕</span> 패배</dt><dd id="losses">0</dd></div>
    <div class="stat draws"><dt><span aria-hidden="true">⊜</span> 무승부</dt><dd id="draws">0</dd></div>
    <div class="stat rate"><dt><span aria-hidden="true">◎</span> 승률</dt><dd id="rate">0%</dd></div>
    <div class="stat streak"><dt><span aria-hidden="true">♨</span> 현재 연승</dt><dd id="streak">0</dd></div>
    <div class="stat best"><dt><span aria-hidden="true">♔</span> 최고 연승</dt><dd id="best">0</dd></div>
  </dl>
  <section class="game" aria-label="가위바위보 대결">
    <div class="arena">
      <div class="side player">
        <h2>PLAYER</h2>
        <div class="display"><svg aria-hidden="true"><use id="player-hand" href="#unknown"/></svg></div>
        <p class="choice-name" id="player-name">대기</p>
      </div>
      <span class="vs" aria-hidden="true">VS</span>
      <div class="side computer">
        <h2>COMPUTER</h2>
        <div class="display"><svg aria-hidden="true"><use id="computer-hand" href="#unknown"/></svg></div>
        <p class="choice-name" id="computer-name">대기</p>
      </div>
    </div>
    <div class="result" id="result">
      <div role="status" aria-live="polite" aria-atomic="true">
        <strong id="result-title">대결 준비!</strong>
        <p id="result-detail">아래에서 가위, 바위, 보 중 하나를 골라 주세요.</p>
      </div>
      <div class="celebration" id="celebration" aria-hidden="true"></div>
    </div>
    <p class="prompt">무엇을 내시겠어요?</p>
    <div class="choices">
      <button class="pick" type="button" data-choice="scissors"><svg aria-hidden="true"><use href="#scissors"/></svg>가위</button>
      <button class="pick" type="button" data-choice="rock"><svg aria-hidden="true"><use href="#rock"/></svg>바위</button>
      <button class="pick" type="button" data-choice="paper"><svg aria-hidden="true"><use href="#paper"/></svg>보</button>
    </div>
    <button type="button" id="reset"><span aria-hidden="true">↻</span> 전적 초기화</button>
  </section>
</main>
<script>
  const storageKey = 'ex02.rps.stats.v1';
  const choices = ['scissors', 'rock', 'paper'];
  const names = { scissors: '가위', rock: '바위', paper: '보' };
  const beats = { scissors: 'paper', rock: 'scissors', paper: 'rock' };
  const reasons = {
    scissors: '가위가 보를 잘랐습니다.',
    rock: '바위가 가위를 이겼습니다.',
    paper: '보가 바위를 감쌌습니다.'
  };
  const emptyStats = { wins: 0, losses: 0, draws: 0, streak: 0, best: 0 };
  const buttons = [...document.querySelectorAll('.pick')];
  const result = document.getElementById('result');
  const resultTitle = document.getElementById('result-title');
  const resultDetail = document.getElementById('result-detail');
  const celebration = document.getElementById('celebration');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let stats = loadStats();
  let activeRound = null;

  function loadStats() {
    try {
      const data = JSON.parse(localStorage.getItem(storageKey));
      const valid = data && Object.keys(emptyStats).every(key =>
        Number.isSafeInteger(data[key]) && data[key] >= 0
      );
      if (valid && data.streak <= data.best && data.best <= data.wins &&
          Number.isSafeInteger(data.wins + data.losses + data.draws)) {
        const { wins, losses, draws, streak, best } = data;
        return { wins, losses, draws, streak, best };
      }
    } catch {
      // Storage can be unavailable or contain invalid JSON.
    }
    return { ...emptyStats };
  }

  function persistStats(reset = false) {
    try {
      if (reset) {
        localStorage.removeItem(storageKey);
      } else {
        localStorage.setItem(storageKey, JSON.stringify(stats));
      }
    } catch {
      // Keep the game playable in browsers that restrict local storage.
    }
  }

  function renderStats() {
    const total = stats.wins + stats.losses + stats.draws;
    const rate = total ? Math.round(stats.wins / total * 100) : 0;
    for (const [key, value] of Object.entries({ ...stats, total, rate: rate + '%' })) {
      document.getElementById(key).textContent = value;
    }
  }

  function showHand(side, choice, label = names[choice]) {
    document.getElementById(side + '-hand').setAttribute('href', '#' + choice);
    document.getElementById(side + '-name').textContent = label;
  }

  function showResult(title, detail, outcome = '') {
    result.className = 'result' + (outcome ? ' ' + outcome + ' reveal' : '');
    resultTitle.textContent = title;
    resultDetail.textContent = detail;
  }

  function setChoicesDisabled(disabled) {
    for (const button of buttons) button.disabled = disabled;
  }

  function stopRound() {
    if (!activeRound) return;
    clearInterval(activeRound.countdown);
    clearInterval(activeRound.shuffle);
    activeRound = null;
    setChoicesDisabled(false);
  }

  function celebrate() {
    if (reducedMotion.matches) return;
    const colors = ['#ffb700', '#219cf4', '#eb586c', '#36a647'];
    for (let index = 0; index < 16; index++) {
      const piece = document.createElement('i');
      const direction = index < 8 ? -1 : 1;
      piece.style.setProperty('--x', (index < 8 ? 27 + index : 59 + index) + '%');
      piece.style.setProperty('--color', colors[index % colors.length]);
      piece.style.setProperty('--delay', (index % 4) * 35 + 'ms');
      piece.style.setProperty('--drift', direction * (16 + (index % 8) * 7) + 'px');
      piece.addEventListener('animationend', () => piece.remove(), { once: true });
      celebration.append(piece);
    }
  }

  function finishRound(round) {
    if (activeRound !== round) return;
    stopRound();
    const { player, computer } = round;
    showHand('player', player);
    showHand('computer', computer);

    if (player === computer) {
      stats.draws++;
      stats.streak = 0;
      showResult('무승부!', '둘 다 ' + names[player] + ' 손 모양을 냈습니다.', 'draw');
    } else if (beats[player] === computer) {
      stats.wins++;
      stats.streak++;
      stats.best = Math.max(stats.best, stats.streak);
      showResult('👑 승리!', reasons[player], 'win');
      celebrate();
    } else {
      stats.losses++;
      stats.streak = 0;
      showResult('패배!', reasons[computer], 'loss');
    }
    renderStats();
    persistStats();
  }

  function play(player) {
    if (activeRound) return;
    const round = { player, computer: choices[Math.floor(Math.random() * choices.length)] };
    activeRound = round;
    setChoicesDisabled(true);
    celebration.replaceChildren();
    showHand('player', player);
    showHand('computer', 'unknown', '선택 중');
    const calls = ['가위!', '바위!', '보!'];
    let call = 0;
    showResult(calls[call], '컴퓨터가 손 모양을 고르고 있어요.');
    if (!reducedMotion.matches) {
      let frame = 0;
      round.shuffle = setInterval(() => {
        if (activeRound !== round) return;
        showHand('computer', choices[frame % choices.length], '선택 중');
        frame++;
      }, 115);
    }
    round.countdown = setInterval(() => {
      if (activeRound !== round) return;
      call++;
      if (call === calls.length) {
        finishRound(round);
      } else {
        resultTitle.textContent = calls[call];
      }
    }, 500);
  }

  function resetGame() {
    stopRound();
    stats = { ...emptyStats };
    persistStats(true);
    renderStats();
    celebration.replaceChildren();
    showHand('player', 'unknown', '대기');
    showHand('computer', 'unknown', '대기');
    showResult('대결 준비!', '아래에서 가위, 바위, 보 중 하나를 골라 주세요.');
  }

  for (const button of buttons) {
    button.addEventListener('click', () => play(button.dataset.choice));
  }
  document.getElementById('reset').addEventListener('click', resetGame);
  renderStats();
</script>
</body>
</html>
