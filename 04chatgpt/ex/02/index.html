
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>우리들의 댕냥 다이어리</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- 사진 규격 통일: 원본 이미지 비율은 유지 -->
  <style>
    .photo-viewport {
      position: relative;
      width: 100%;
      height: auto !important;
      min-height: 0;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #faf6f2;
    }

    .photo-viewport > .photo-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .photo-viewport > .photo-slide[hidden] {
      display: none !important;
    }

    .photo-viewport > .photo-slide > img {
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain !important;
      object-position: center;
    }
  </style>

  <script src="js/script.js" defer></script>
</head>

<body>

  <!-- 재사용할 SVG 아이콘 -->
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true">

    <symbol id="icon-paw" viewBox="0 0 64 64">
      <ellipse cx="17" cy="19" rx="6" ry="9"
               transform="rotate(-22 17 19)"/>
      <ellipse cx="32" cy="12" rx="6" ry="9"/>
      <ellipse cx="47" cy="19" rx="6" ry="9"
               transform="rotate(22 47 19)"/>
      <ellipse cx="54" cy="33" rx="5" ry="7"
               transform="rotate(25 54 33)"/>
      <path d="M32 29c-8 0-11 7-16 12-7 7-2 16 6 16
               4 0 6-3 10-3s6 3 10 3c8 0 13-9 6-16
               -5-5-8-12-16-12z"/>
    </symbol>

    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7
               l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21
               l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>
    </symbol>

    <symbol id="icon-comment" viewBox="0 0 24 24">
      <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5
               9.3 9.3 0 0 1-3.8-.8L3 21l1.8-5.2
               A8.5 8.5 0 1 1 21 11.5z"/>
    </symbol>

    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6"/>
    </symbol>

    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="M9 18l6-6-6-6"/>
    </symbol>

    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M7 3v4M17 3v4M3 10h18"/>
    </symbol>

    <symbol id="icon-pencil" viewBox="0 0 24 24">
      <path d="M4 20l4.5-1 11-11a2 2 0 0 0-3-3
               l-11 11L4 20z"/>
      <path d="M14.5 7.5l3 3"/>
    </symbol>

  </svg>

  <!-- 배경 장식 -->
  <div class="background-paw paw-one" aria-hidden="true">
    <svg><use href="#icon-paw"></use></svg>
  </div>

  <div class="background-paw paw-two" aria-hidden="true">
    <svg><use href="#icon-paw"></use></svg>
  </div>

  <div class="background-paw paw-three" aria-hidden="true">
    <svg><use href="#icon-paw"></use></svg>
  </div>

  <!-- 사이트 상단 -->
  <header class="site-header">

    <!-- 강아지 일러스트 -->
    <svg class="header-mascot mascot-dog"
         viewBox="0 0 160 125"
         role="img"
         aria-label="웃고 있는 강아지 일러스트">

      <path d="M34 47C15 25 9 60 27 84
               C13 101 24 115 43 105
               L117 105C137 115 148 100 132 84
               C150 60 144 25 126 47
               C114 13 47 13 34 47Z"
            fill="#f8e6d0"
            stroke="#986d61"
            stroke-width="4"
            stroke-linejoin="round"/>

      <ellipse cx="52" cy="69" rx="5" ry="6" fill="#6c4940"/>
      <ellipse cx="108" cy="69" rx="5" ry="6" fill="#6c4940"/>

      <ellipse cx="39" cy="82" rx="12" ry="7" fill="#f5bbc0"/>
      <ellipse cx="121" cy="82" rx="12" ry="7" fill="#f5bbc0"/>

      <ellipse cx="80" cy="80" rx="6" ry="4" fill="#6c4940"/>

      <path d="M80 84v6m0 0c-9 11-18 0-18-2
               m18 2c9 11 18 0 18-2"
            fill="none"
            stroke="#6c4940"
            stroke-width="3.5"
            stroke-linecap="round"/>

      <ellipse cx="45" cy="108" rx="19" ry="12"
               fill="#fff1e4" stroke="#986d61"
               stroke-width="3"/>
      <ellipse cx="115" cy="108" rx="19" ry="12"
               fill="#fff1e4" stroke="#986d61"
               stroke-width="3"/>
    </svg>

    <div class="site-identity">

      <div class="title-row">
        <h1>우리들의 댕냥 다이어리</h1>

        <svg class="title-paw" aria-hidden="true">
          <use href="#icon-paw"></use>
        </svg>
      </div>

      <p class="account-name">@with_my_pets</p>

      <p class="site-description">
        소듕한 우리 집의 강아지 &amp; 고양이들
        <span class="description-heart">♥</span>
      </p>

    </div>

    <!-- 고양이 일러스트 -->
    <svg class="header-mascot mascot-cat"
         viewBox="0 0 160 125"
         role="img"
         aria-label="웃고 있는 고양이 일러스트">

      <path d="M22 54L29 12 60 33
               Q80 25 100 33
               L131 12 138 54
               Q148 104 80 106
               Q12 104 22 54Z"
            fill="#fff0e7"
            stroke="#986d61"
            stroke-width="4"
            stroke-linejoin="round"/>

      <path d="M35 28l-3 23 20-13z
               M125 28l3 23-20-13z"
            fill="#f2b3bd"/>

      <path d="M45 65q9 9 18 0
               M97 65q9 9 18 0"
            fill="none"
            stroke="#6c4940"
            stroke-width="3.5"
            stroke-linecap="round"/>

      <ellipse cx="44" cy="78" rx="13" ry="7" fill="#f7bdc4"/>
      <ellipse cx="116" cy="78" rx="13" ry="7" fill="#f7bdc4"/>

      <path d="M75 77q5-5 10 0l-5 5z"
            fill="#9a655f"/>

      <path d="M80 82v5m0 0q-9 10-17 0
               m17 0q9 10 17 0"
            fill="none"
            stroke="#6c4940"
            stroke-width="3"
            stroke-linecap="round"/>

      <path d="M24 81l-18-5m18 13L6 94
               m130-13l18-5m-18 13l18 5"
            fill="none"
            stroke="#986d61"
            stroke-width="2.5"
            stroke-linecap="round"/>

      <ellipse cx="46" cy="109" rx="18" ry="11"
               fill="#fff8f3" stroke="#986d61"
               stroke-width="3"/>
      <ellipse cx="114" cy="109" rx="18" ry="11"
               fill="#fff8f3" stroke="#986d61"
               stroke-width="3"/>
    </svg>

  </header>

  <!-- 다이어리 본문 -->
  <main class="diary-shell">

    <!-- 다이어리 바인더 고리 -->
    <div class="binding-rings" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <article class="diary-paper">

      <!-- 게시물 상단 -->
      <div class="post-header">

        <div class="pet-profile">

          <div class="pet-avatar" aria-hidden="true">
            <svg viewBox="0 0 90 90">
              <circle cx="45" cy="45" r="44" fill="#fff3e8"/>
              <ellipse cx="22" cy="42" rx="15" ry="24"
                       fill="#dcb99f"/>
              <ellipse cx="68" cy="42" rx="15" ry="24"
                       fill="#dcb99f"/>
              <circle cx="45" cy="42" r="29" fill="#f6dfc8"/>
              <circle cx="34" cy="40" r="3.3" fill="#503b37"/>
              <circle cx="56" cy="40" r="3.3" fill="#503b37"/>
              <ellipse cx="45" cy="54" rx="14" ry="11"
                       fill="#fff4e8"/>
              <ellipse cx="45" cy="51" rx="4" ry="3"
                       fill="#503b37"/>
              <path d="M45 54v4m0 0q-6 5-10 0m10 0q6 5 10 0"
                    fill="none" stroke="#503b37"
                    stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="pet-information">
            <h2>설이 <span class="name-heart">♡</span></h2>
            <p>강아지 · 말티푸들 · 5살</p>
          </div>

        </div>

        <div class="post-date">
          <svg class="icon" aria-hidden="true">
            <use href="#icon-calendar"></use>
          </svg>
          <time datetime="2026-11-23">2026.11.23</time>
        </div>

      </div>

      <!-- 사진 슬라이드 -->
      <section class="photo-section"
               aria-label="설이 사진 갤러리">

        <div class="polaroid-frame">

          <!-- 왼쪽 마스킹테이프 -->
          <span class="washi-tape tape-left"
                aria-hidden="true"></span>

          <div class="photo-viewport"
               id="photoCarousel"
               tabindex="0"
               aria-label="사진 갤러리. 방향키로 이동할 수 있습니다.">

            <!-- 사진 1 -->
            <!-- 실제 사진: images/seol-01.jpg -->
            <div class="photo-slide" data-slide="0">
              <img
                src="images/img01.PNG"
                alt="설이의 첫 번째 일상 사진"
              >

              <div class="photo-placeholder" aria-hidden="true">
                <svg class="placeholder-paw">
                  <use href="#icon-paw"></use>
                </svg>
                <span>설이의 사진 1</span>
                <small>images/seol-01.jpg</small>
              </div>
            </div>

            <!-- 사진 2 -->
            <!-- 실제 사진: images/seol-02.jpg -->
            <div class="photo-slide" data-slide="1" hidden>
              <img
                src="images/img02.PNG"
                alt="설이의 두 번째 일상 사진"
              >

              <div class="photo-placeholder" aria-hidden="true">
                <svg class="placeholder-paw">
                  <use href="#icon-paw"></use>
                </svg>
                <span>설이의 사진 2</span>
                <small>images/seol-02.jpg</small>
              </div>
            </div>

            <!-- 사진 3 -->
            <!-- 실제 사진: images/seol-03.jpg -->
            <div class="photo-slide" data-slide="2" hidden>
              <img
                src="images/img03.PNG"
                alt="설이의 세 번째 일상 사진"
              >

              <div class="photo-placeholder" aria-hidden="true">
                <svg class="placeholder-paw">
                  <use href="#icon-paw"></use>
                </svg>
                <span>설이의 사진 3</span>
                <small>images/seol-03.jpg</small>
              </div>
            </div>

            <!-- 이전 사진 -->
            <button class="carousel-arrow arrow-prev"
                    id="prevPhoto"
                    type="button"
                    aria-label="이전 사진">

              <svg class="icon" aria-hidden="true">
                <use href="#icon-chevron-left"></use>
              </svg>
            </button>

            <!-- 다음 사진 -->
            <button class="carousel-arrow arrow-next"
                    id="nextPhoto"
                    type="button"
                    aria-label="다음 사진">

              <svg class="icon" aria-hidden="true">
                <use href="#icon-chevron-right"></use>
              </svg>
            </button>

            <!-- 현재 사진 위치 -->
            <div class="carousel-dots" aria-hidden="true">
              <span class="carousel-dot active"></span>
              <span class="carousel-dot"></span>
              <span class="carousel-dot"></span>
            </div>

          </div>

          <!-- 오른쪽 마스킹테이프 -->
          <span class="washi-tape tape-right"
                aria-hidden="true"></span>

        </div>

        <span id="slideAnnouncement"
              class="sr-only"
              role="status"
              aria-live="polite">
          사진 1 / 3
        </span>

      </section>

      <!-- 좋아요와 일상 글 -->
      <section class="post-content"
               aria-label="설이의 일상 글">

        <div class="post-actions">

          <button id="likeButton"
                  class="like-button"
                  type="button"
                  aria-pressed="false"
                  aria-label="좋아요">

            <svg class="icon heart-icon" aria-hidden="true">
              <use href="#icon-heart"></use>
            </svg>
          </button>

          <svg class="icon comment-icon"
               aria-hidden="true">
            <use href="#icon-comment"></use>
          </svg>

          <div class="action-divider" aria-hidden="true"></div>

          <div class="post-caption">
            <p>설이가 화가 났다 <span aria-hidden="true">💢</span></p>

            <div class="hashtags">
              <span>#설이</span>
              <span>#강아지일상</span>
            </div>
          </div>

        </div>

      </section>

      <!-- 댓글 입력 -->
      <section class="comment-section" aria-label="댓글 작성">

        <form id="commentForm" novalidate>

          <div class="comment-compose">

            <svg class="icon pencil-icon"
                 aria-hidden="true">
              <use href="#icon-pencil"></use>
            </svg>

            <label for="commentInput" class="sr-only">
              댓글 입력
            </label>

            <textarea
              id="commentInput"
              rows="1"
              placeholder="따뜻한 댓글을 남겨주세요."
            ></textarea>

            <output id="characterCount"
                    class="character-count"
                    for="commentInput"
                    aria-live="polite">0자</output>

            <button class="comment-submit"
                    type="submit">
              댓글 등록
            </button>

          </div>

        </form>

      </section>

      <!-- 장식용 스티커 -->
      <div class="sticker sticker-paw" aria-hidden="true">
        <svg><use href="#icon-paw"></use></svg>
      </div>

      <div class="sticker sticker-bone" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <path d="M20 12c-9-8-21 3-12 13
                   l8 8-1 14-8 8c-9 10 3 21 12 13
                   8 7 19 0 18-9l16-16
                   c9 1 16-10 9-18
                   8-9-3-21-13-12l-8 8-14 1z"
                fill="#ffe79a"
                stroke="#dfc16b"
                stroke-width="3"/>
        </svg>
      </div>

    </article>

  </main>

  <!-- 댓글 저장 불가 안내 팝업 -->
  <dialog id="commentNotice"
          class="notice-dialog"
          aria-labelledby="noticeTitle"
          aria-describedby="noticeDescription">

    <div class="notice-decoration" aria-hidden="true">🐾</div>

    <h2 id="noticeTitle">안내</h2>

    <p id="noticeDescription">
      현재 댓글 저장 기능은 지원하지 않습니다.
    </p>

    <button type="button"
            id="closeNotice"
            class="notice-close">
      확인
    </button>

  </dialog>

</body>
</html>
