<!DOCTYPE html>
<html>
    <head>
        <title>다양한 태그</title>
    </head>

    <body>
        <!-- "속성" 태그는 파란색으로 구분되어 있음, 참고하기 -->



        <h3>링크 태그</h3>
        <!--속성-->
        <a href="https://naver.com" target="_blank">네이버로 이동</a>

        <br>
        <a href="ex01.html" target="_blank">예제1</a>



        <h3>이미지 태그</h3>
        <img alt="귀여운 햄스터" width="200" height="" src="https://images.unsplash.com/photo-1584553421349-3557471bed79?q=80&w=1146&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D">
        <br>
        <img alt="냥냥이" height="250" src="images/cat.jpg">


        <h3>TYPING TAG</h3>
        <label>검색</label> <input type="text">
        


        <h3>BUTTON</h3>
        <button type="button">입력</button>



        <h3>SELECT BOX</h3>
        <select>
            <option>사과</option>
            <option>바나나</option>
        </select>



        <h3>CHECK BOX</h3>
        <input type="checkbox"><label>동의합니다</label>
        <input type="checkbox"><label>개인정보 처리 동의합니다</label>



        <h3>TEXT AREA</h3>
        <textarea rows="10" cols="30">여기에 입력해주세요.</textarea>


    </body>

</html>
