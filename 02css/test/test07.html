<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <title>회원가입</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    

        <!-- HOW TO SET MY OWN COLOR NO. IN # OTHER THAN THE SETTINGS IN BOOTSTRAP, ADD <style> TAG -->
        <style>
            .bg-light-gray {
                background-color:lightgrey
            }

            .text-small {
                font-size:13px;
            }

        </style>
    
    
    </head>

    <body>
        <div class="container mt-4">
            <!-- padding & margin : top, bottom, left, right -->
            <!-- padding & margin : x (for classes that set both left,right) -->
            <!-- padding & margin : y (for classes that set both top,bottom) -->

            <h2 class="text-primary text-center fw-bold">회원가입</h2>
            <p class="text-center fw-bold text-small">회원 정보를 입력해 주세요.</p>
            <hr>
        
            <div class="bg-light p-3 rounded border">
        
                <label class="pb-3 fw-bold">이름</label><br>
                <input type="text" class="form-control" placeholder="이름을 입력하세요">
                
                <label class="py-3 fw-bold">이메일</label><br>
                <input type="text" class="form-control" placeholder="example@email.com">

                <label class="py-3 fw-bold">비밀번호</label><br>
                <input type="password" class="form-control" placeholder="비밀번호를 입력하세요">
                
                <p class="bg-info p-3 mt-3 rounded fw-bold">모든 항목을 입력해주세요.</p>


                <!-- BUTTONS -->
                <p class="text-center">
                    <a href="test07_1.html" target="_blank">
                        <!-- <a> 버튼 누르면 다른 링크로 이동, target="_blank" 는 새로운 blank 페이지로 이동-->
                     <button type="button" class="btn btn-primary">가입하기</button>
                    </a>

                    <button type="button" class="btn btn-danger">취소</button>
                </p>

            </div>

        </div>

    </body>

</html>
